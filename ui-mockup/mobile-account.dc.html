<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Mobile tài khoản</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=Baloo+2:wght@700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#CA0404}a:hover{color:#9C0303}
.fnb{--bg:#FFFFFF;--bg-subtle:#F9F6F4;--bg-muted:#F1ECE8;--border:#E4DAD4;--border-strong:#9F8D7F;--text:#282019;--text-muted:#6D5D51;--text-subtle:#7A695C;--primary:#CA0404;--primary-fg:#FFFFFF;--primary-subtle:#FEE7E3;--primary-text:#9C0303;--accent:#ED6F03;--accent-fg:#211510;--danger:#C2185B;--danger-text:#8B023D;--brick:#8A2A26;--shadow-sm:0 1px 2px rgba(40,32,25,.08),0 1px 3px rgba(40,32,25,.06);font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--text);background:var(--bg);line-height:1.45}
.fnb.dark{--bg:#1A1411;--bg-subtle:#282019;--bg-muted:#3E332A;--border:#55473D;--border-strong:#857366;--text:#F9F6F4;--text-muted:#D1C3B9;--text-subtle:#B8A79A;--primary:#F84839;--primary-fg:#1A1411;--primary-subtle:#470000;--primary-text:#FEAEA2;--accent:#FA8840;--accent-fg:#1A1411;--danger:#EF4B7F;--danger-text:#FEAABC;--brick:#62211E;--shadow-sm:0 1px 2px rgba(0,0,0,.4)}
.fnb button{font-family:inherit;cursor:pointer}
.fnb .num{font-variant-numeric:tabular-nums}
.fnb .display{font-family:'Baloo 2',sans-serif;font-weight:800;line-height:1.1}
</style>
</helmet>
<div class="fnb {{themeClass}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: var(--bg-subtle)">

  <header style="flex-shrink: 0; background: var(--brick); color: #FFFFFF; padding: 20px 16px 0">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 56px; height: 56px; border-radius: 999px; background: #F6F1EA; color: #8A2A26; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800">MA</span>
      <div style="flex-grow: 1; display: flex; flex-direction: column">
        <span class="display" style="font-size: 24px">Minh Anh</span>
        <span class="num" style="font-size: 14px; opacity: .9">0912 345 678</span>
      </div>
      <img src="/_blob/dbbc95b08d47870e1964f1322682c11f" alt="" style="width: 48px; height: 48px; object-fit: contain">
    </div>
    <svg width="390" height="28" viewBox="0 0 390 28" preserveAspectRatio="none" aria-hidden="true" style="display: block; margin: 16px -16px 0"><path d="M0 28V12c32 0 32 12 65 12s32-16 65-16 32 16 65 16 32-16 65-16 32 16 65 16 32-12 65-12v16Z" fill="var(--bg-subtle)"/></svg>
  </header>

  <main style="flex-grow: 1; overflow: hidden; padding: 0 16px 100px; display: flex; flex-direction: column; gap: 12px">
    <!-- Points card -->
    <section aria-label="Điểm thành viên" style="border-radius: 16px; padding: 16px; background: var(--accent); color: var(--accent-fg); display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow-sm)">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 13px; font-weight: 800; letter-spacing: .04em">THÀNH VIÊN BẠC</span>
        <span class="num display" style="font-size: 30px">1.240 điểm</span>
      </div>
      <div style="height: 8px; border-radius: 999px; background: rgba(33,21,16,.2); overflow: hidden"><div style="width: 62%; height: 100%; border-radius: 999px; background: #211510"></div></div>
      <span style="font-size: 13px; font-weight: 600">Còn 760 điểm nữa lên hạng Vàng</span>
    </section>

    <!-- List rows -->
    <nav aria-label="Tài khoản" style="border-radius: 16px; background: var(--bg); border: 1px solid var(--border); overflow: hidden">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="3">
        <a href="{{ r.href }}" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px; border-bottom: 1px solid var(--border); color: var(--text); text-decoration: none; font-size: 15px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--text-muted)"><path d="{{ r.icon }}"/></svg>
          <span style="flex-grow: 1; font-weight: 600">{{ r.label }}</span>
          <span style="font-size: 13px; color: var(--text-muted)">{{ r.meta }}</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--text-subtle)"><path d="m9 18 6-6-6-6"/></svg>
        </a>
      </sc-for>
    </nav>

    <!-- Settings -->
    <section aria-label="Cài đặt" style="border-radius: 16px; background: var(--bg); border: 1px solid var(--border); padding: 14px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 14px; font-weight: 700">Giao diện</span>
        <div role="radiogroup" aria-label="Giao diện" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 4px; gap: 4px; border-radius: 14px; background: var(--bg-muted)">
          <sc-for list="{{ theme }}" as="t" hint-placeholder-count="3">
            <button type="button" role="radio" aria-checked="{{ t.checked }}" style="{{ t.style }}">{{ t.label }}</button>
          </sc-for>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 14px; font-weight: 700">Ngôn ngữ</span>
        <div role="radiogroup" aria-label="Ngôn ngữ" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 4px; gap: 4px; border-radius: 14px; background: var(--bg-muted)">
          <sc-for list="{{ lang }}" as="t" hint-placeholder-count="2">
            <button type="button" role="radio" aria-checked="{{ t.checked }}" style="{{ t.style }}">{{ t.label }}</button>
          </sc-for>
        </div>
      </div>
    </section>

    <a href="mobile-login.dc.html" style="height: 52px; border-radius: 16px; border: 1px solid var(--danger); background: var(--bg); color: var(--danger-text); font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      Đăng xuất
    </a>
  </main>

  <!-- TabBar -->
  <nav aria-label="Điều hướng chính" style="position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--border); background: var(--bg); padding-bottom: 20px">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
      <a href="{{ t.href }}" aria-current="{{ t.current }}" style="{{ t.style }}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ t.icon }}"/></svg>
        {{ t.label }}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      { label: 'Lịch sử đơn', meta: '12 đơn', href: 'mobile-order-status.dc.html', icon: 'M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1ZM16 8h-6M16 12H8M13 16H8' },
      { label: 'Ưu đãi của tôi', meta: '2', href: '#', icon: 'M12 2H2v10l9.29 9.29a1 1 0 0 0 1.41 0l8.59-8.59a1 1 0 0 0 0-1.41ZM7 7h.01' },
      { label: 'Thông tin và email', meta: '', href: '#', icon: 'M12 4a4 4 0 1 1 0 8 4 4 0 0 1 0-8M4 21a8 8 0 0 1 16 0' },
      { label: 'Đổi mã PIN', meta: '', href: '#', icon: 'M5 11h14a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2M7 11V7a5 5 0 0 1 10 0v4' }
    ];
    const seg = (on) => 'height: 44px; border: 0; border-radius: 10px; font-size: 14px; '
      + (on ? 'background: var(--bg); color: var(--text); font-weight: 700;' : 'background: transparent; color: var(--text-muted);');
    const opts = (list, active) => list.map((label, i) => ({ label, checked: i === active ? 'true' : 'false', style: seg(i === active) }));
    const tabsRaw = [
      ['Thực đơn', 'M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7', false, 'mobile-menu.dc.html'],
      ['Đơn hàng', 'M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1ZM16 8h-6M16 12H8M13 16H8', false, 'mobile-order-status.dc.html'],
      ['Ưu đãi', 'M12 2H2v10l9.29 9.29a1 1 0 0 0 1.41 0l8.59-8.59a1 1 0 0 0 0-1.41ZM7 7h.01', false, '#'],
      ['Tài khoản', 'M12 4a4 4 0 1 1 0 8 4 4 0 0 1 0-8M4 21a8 8 0 0 1 16 0', true, '#']
    ];
    const tabs = tabsRaw.map(([label, icon, on, href]) => ({
      label, icon, href, current: on ? 'page' : 'false',
      style: 'height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; text-decoration: none; color: ' + (on ? 'var(--primary)' : 'var(--text-muted)') + ';'
    }));
    return {
      themeClass: this.props.dark ? 'dark' : '',
      rows,
      theme: opts(['Theo hệ thống', 'Sáng', 'Tối'], 0),
      lang: opts(['Tiếng Việt', 'English'], 0),
      tabs
    };
  }
}
</script>
</body>
</html>
