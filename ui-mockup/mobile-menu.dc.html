<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Mobile thực đơn</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=Baloo+2:wght@700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#CA0404}a:hover{color:#9C0303}
.fnb{--bg:#FFFFFF;--bg-subtle:#F9F6F4;--bg-muted:#F1ECE8;--border:#E4DAD4;--border-strong:#9F8D7F;--text:#282019;--text-muted:#6D5D51;--text-subtle:#7A695C;--primary:#CA0404;--primary-fg:#FFFFFF;--primary-subtle:#FEE7E3;--primary-text:#9C0303;--accent:#ED6F03;--accent-fg:#211510;--accent-subtle:#FEE8DC;--accent-text:#984502;--brick:#8A2A26;--cream:#F6F1EA;--shadow-md:0 4px 12px rgba(40,32,25,.16);font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--text);background:var(--bg);line-height:1.45}
.fnb.dark{--bg:#1A1411;--bg-subtle:#282019;--bg-muted:#3E332A;--border:#55473D;--border-strong:#857366;--text:#F9F6F4;--text-muted:#D1C3B9;--text-subtle:#B8A79A;--primary:#F84839;--primary-fg:#1A1411;--primary-subtle:#470000;--primary-text:#FEAEA2;--accent:#FA8840;--accent-fg:#1A1411;--accent-subtle:#3A1600;--accent-text:#FEB187;--shadow-md:0 4px 12px rgba(0,0,0,.5)}
.fnb button{font-family:inherit;cursor:pointer}
.fnb .num{font-variant-numeric:tabular-nums}
.fnb .display{font-family:'Baloo 2',sans-serif;font-weight:800;line-height:1.15}
</style>
</helmet>
<div class="fnb {{themeClass}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: var(--bg)">

  <!-- CustomerShell header -->
  <header style="flex-shrink: 0; background: var(--brick); color: #FFFFFF; padding: 16px 16px 0">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center"><img src="/_blob/dbbc95b08d47870e1964f1322682c11f" alt="Banhkepchonong" style="width: 38px; height: 38px; object-fit: contain"></span>
      <div style="display: flex; flex-direction: column; flex-grow: 1">
        <span class="display" style="font-size: 22px">Banhkepchonong</span>
        <button type="button" style="height: 24px; padding: 0; border: 0; background: transparent; color: #FFFFFF; font-size: 13px; text-align: left; display: flex; align-items: center; gap: 4px">Quận 1 · mở đến 22:00
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      </div>
      <button type="button" aria-label="Tìm món" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(255,255,255,.4); background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>
    </div>
    <svg width="390" height="28" viewBox="0 0 390 28" preserveAspectRatio="none" aria-hidden="true" style="display: block; margin: 12px -16px 0"><path d="M0 28V12c32 0 32 12 65 12s32-16 65-16 32 16 65 16 32-16 65-16 32 16 65 16 32-12 65-12v16Z" fill="#F6F1EA"/></svg>
  </header>

  <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column">
    <!-- Promo strip on cream -->
    <div style="background: var(--cream); padding: 4px 16px 16px; color: #282019; display: flex; flex-direction: column; gap: 10px">
      <span class="display" style="font-size: 26px; color: #8A2A26">Nóng hổi, kẹp liền tay!</span>
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E4DAD4">
        <span style="height: 28px; padding: 0 10px; border-radius: 999px; background: #ED6F03; color: #211510; font-size: 12px; font-weight: 800; display: flex; align-items: center">-20%</span>
        <span style="flex-grow: 1; font-size: 13px">Thứ Ba vui vẻ · đơn từ 100.000 ₫</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </div>
    </div>

    <!-- Chips -->
    <div role="tablist" aria-label="Nhóm món" style="display: flex; gap: 8px; padding: 12px 16px; overflow: hidden; flex-shrink: 0; border-bottom: 1px solid var(--border)">
      <sc-for list="{{ chips }}" as="c" hint-placeholder-count="5">
        <button type="button" role="tab" aria-selected="{{ c.selected }}" style="{{ c.style }}">{{ c.label }}</button>
      </sc-for>
    </div>

    <!-- Product list -->
    <div style="flex-grow: 1; overflow: hidden; padding: 12px 16px 160px; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 17px; font-weight: 700">Hotdog</span>
      <sc-for list="{{ products }}" as="p" hint-placeholder-count="4">
        <div style="{{ p.cardStyle }}">
          <div style="width: 104px; height: 78px; flex-shrink: 0; border-radius: 10px; background: var(--bg-muted); display: flex; align-items: center; justify-content: center; color: var(--text-subtle); position: relative">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
            <sc-if value="{{ p.isNew }}" hint-placeholder-val="{{ false }}">
              <span style="position: absolute; top: 6px; left: 6px; height: 20px; padding: 0 8px; border-radius: 999px; background: var(--accent); color: var(--accent-fg); font-size: 11px; font-weight: 700; display: flex; align-items: center">Mới</span>
            </sc-if>
          </div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <span style="font-size: 15px; font-weight: 700">{{ p.name }}</span>
            <span style="font-size: 13px; color: var(--text-muted)">{{ p.desc }}</span>
            <div style="display: flex; align-items: center; justify-content: space-between; margin-top: auto">
              <span class="num" style="font-size: 15px; font-weight: 700">{{ p.price }}</span>
              <sc-if value="{{ p.inCart }}" hint-placeholder-val="{{ false }}">
                <span class="num" style="height: 32px; padding: 0 12px; border-radius: 999px; background: var(--primary-subtle); color: var(--primary-text); font-size: 13px; font-weight: 700; display: flex; align-items: center">Trong giỏ: {{ p.qty }}</span>
              </sc-if>
              <sc-if value="{{ p.canAdd }}" hint-placeholder-val="{{ true }}">
                <button type="button" aria-label="{{ p.addLabel }}" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: var(--primary); color: var(--primary-fg); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button>
              </sc-if>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- BottomBar + TabBar -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(transparent, var(--bg) 24px)">
    <div style="padding: 16px 12px 10px">
      <button type="button" style="width: 100%; height: 56px; border-radius: 16px; border: 0; background: var(--primary); color: var(--primary-fg); display: flex; align-items: center; gap: 12px; padding: 0 16px; font-size: 15px; font-weight: 700; box-shadow: var(--shadow-md)">
        <span class="num" style="min-width: 28px; height: 28px; border-radius: 999px; background: var(--primary-fg); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 14px">3</span>
        <span style="flex-grow: 1; text-align: left">Xem giỏ hàng</span>
        <span class="num">147.000 ₫</span>
      </button>
    </div>
    <nav aria-label="Điều hướng chính" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--border); background: var(--bg); padding-bottom: 20px">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
        <a href="{{ t.href }}" aria-current="{{ t.current }}" style="{{ t.style }}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ t.icon }}"/></svg>
          {{ t.label }}
        </a>
      </sc-for>
    </nav>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const chips = ['Nổi bật', 'Hotdog', 'Burger', 'Món thêm', 'Đồ uống'].map((label, i) => ({
      label,
      selected: i === 1 ? 'true' : 'false',
      style: 'flex-shrink: 0; height: 40px; padding: 0 16px; border-radius: 999px; font-size: 14px; '
        + (i === 1 ? 'border: 0; background: var(--text); color: var(--bg); font-weight: 600;' : 'border: 1px solid var(--border); background: var(--bg); color: var(--text); font-weight: 500;')
    }));
    const raw = [
      { name: 'Hotdog cổ điển', desc: 'Xúc xích nướng, mù tạt, sốt cà chua', price: '35.000 ₫' },
      { name: 'Hotdog phô mai', desc: 'Phô mai cheddar tan chảy, hành phi', price: '45.000 ₫', qty: 2 },
      { name: 'Hotdog cay Hàn Quốc', desc: 'Sốt gochujang, kim chi giòn', price: '49.000 ₫', isNew: true },
      { name: 'Hotdog xúc xích Đức', desc: 'Xúc xích Đức, dưa cải chua', price: '55.000 ₫' }
    ];
    const products = raw.map((p) => ({
      ...p,
      isNew: !!p.isNew,
      inCart: (p.qty ?? 0) > 0,
      canAdd: !((p.qty ?? 0) > 0),
      addLabel: 'Thêm ' + p.name,
      cardStyle: 'display: flex; gap: 12px; padding: 10px; border-radius: 16px; background: var(--bg); '
        + ((p.qty ?? 0) > 0 ? 'border: 2px solid var(--primary);' : 'border: 1px solid var(--border);')
    }));
    const tabsRaw = [
      ['Thực đơn', 'M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7', true, '#'],
      ['Đơn hàng', 'M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1ZM16 8h-6M16 12H8M13 16H8', false, 'mobile-order-status.dc.html'],
      ['Ưu đãi', 'M12 2H2v10l9.29 9.29a1 1 0 0 0 1.41 0l8.59-8.59a1 1 0 0 0 0-1.41ZM7 7h.01', false, '#'],
      ['Tài khoản', 'M12 4a4 4 0 1 1 0 8 4 4 0 0 1 0-8M4 21a8 8 0 0 1 16 0', false, '#']
    ];
    const tabs = tabsRaw.map(([label, icon, on, href]) => ({
      label, icon, href, current: on ? 'page' : 'false',
      style: 'height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; text-decoration: none; color: ' + (on ? 'var(--primary)' : 'var(--text-muted)') + ';'
    }));
    return { themeClass: this.props.dark ? 'dark' : '', chips, products, tabs };
  }
}
</script>
</body>
</html>
