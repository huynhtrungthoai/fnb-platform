<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>POS đăng nhập</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#CA0404}a:hover{color:#9C0303}
.fnb{--bg:#FFFFFF;--bg-subtle:#F9F6F4;--bg-muted:#F1ECE8;--border:#E4DAD4;--border-strong:#9F8D7F;--text:#282019;--text-muted:#6D5D51;--text-subtle:#7A695C;--primary:#CA0404;--primary-fg:#FFFFFF;--primary-subtle:#FEE7E3;--primary-text:#9C0303;--accent:#ED6F03;--accent-fg:#211510;--accent-subtle:#FEE8DC;--accent-text:#984502;--success:#2F7D46;--success-fg:#FFFFFF;--success-subtle:#E0F3E3;--success-text:#17592C;--warning:#F5BC09;--warning-fg:#211510;--warning-subtle:#F9ECCE;--warning-text:#795B03;--danger:#C2185B;--danger-fg:#FFFFFF;--danger-subtle:#FFE5EA;--danger-text:#8B023D;--info:#2563A8;--info-fg:#FFFFFF;--info-subtle:#E1EEFE;--info-text:#184B83;--shadow-sm:0 1px 2px rgba(40,32,25,.08),0 1px 3px rgba(40,32,25,.06);font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--text);background:var(--bg);line-height:1.45}
.fnb.dark{--bg:#1A1411;--bg-subtle:#282019;--bg-muted:#3E332A;--border:#55473D;--border-strong:#857366;--text:#F9F6F4;--text-muted:#D1C3B9;--text-subtle:#B8A79A;--primary:#F84839;--primary-fg:#1A1411;--primary-subtle:#470000;--primary-text:#FEAEA2;--accent:#FA8840;--accent-fg:#1A1411;--accent-subtle:#3A1600;--accent-text:#FEB187;--success:#58A46B;--success-fg:#1A1411;--success-subtle:#002A0E;--success-text:#A0D5AB;--warning:#F5BC09;--warning-fg:#1A1411;--warning-subtle:#2C1F00;--warning-text:#E7C067;--danger:#EF4B7F;--danger-fg:#1A1411;--danger-subtle:#45001A;--danger-text:#FEAABC;--info:#5693DC;--info-fg:#1A1411;--info-subtle:#012145;--info-text:#9DC9FF;--shadow-sm:0 1px 2px rgba(0,0,0,.4)}
.fnb button{font-family:inherit;cursor:pointer}
.fnb .num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div class="fnb {{themeClass}}" style="width: 1280px; height: 800px; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-subtle)">

  <header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 16px; padding: 0 16px; background: var(--bg); border-bottom: 1px solid var(--border)">
    <img src="/_blob/dbbc95b08d47870e1964f1322682c11f" alt="Banhkepchonong" style="width: 40px; height: 40px; object-fit: contain">
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 14px; font-weight: 600">Banhkepchonong · Chi nhánh Quận 1</span>
      <span style="font-size: 12px; color: var(--text-muted)">Thiết bị: Quầy 1 · POS-Q1-01</span>
    </div>
    <div style="flex-grow: 1"></div>
    <span style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; background: var(--success-subtle); color: var(--success-text); font-size: 13px; font-weight: 500">Trực tuyến</span>
    <span class="num" style="font-size: 15px; font-weight: 600">09:32</span>
  </header>

  <main style="flex-grow: 1; display: flex; gap: 24px; padding: 24px; min-height: 0">
    <!-- Staff picker -->
    <section aria-labelledby="pickTitle" style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 16px">
      <div>
        <h1 id="pickTitle" style="margin: 0; font-size: 24px; font-weight: 700">Chọn nhân viên</h1>
        <span style="font-size: 14px; color: var(--text-muted)">Nhân viên được gán cho chi nhánh Quận 1</span>
      </div>
      <div role="radiogroup" aria-label="Nhân viên" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{ staff }}" as="s" hint-placeholder-count="6">
          <button type="button" role="radio" aria-checked="{{ s.checked }}" style="{{ s.style }}">
            <span style="{{ s.avatar }}">{{ s.initials }}</span>
            <span style="display: flex; flex-direction: column; align-items: flex-start; min-width: 0">
              <span style="font-size: 16px; font-weight: 600; color: var(--text)">{{ s.name }}</span>
              <span style="font-size: 13px; color: var(--text-muted)">{{ s.role }}</span>
            </span>
          </button>
        </sc-for>
      </div>
      <div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 10px; background: var(--info-subtle); color: var(--info-text); font-size: 14px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20M12 16v-4M12 8h.01"/></svg>
        <span>Mất mạng vẫn đăng nhập được bằng bản lưu trên máy (hết hạn sau 72 giờ).</span>
      </div>
    </section>

    <!-- PIN -->
    <section aria-labelledby="pinTitle" style="width: 420px; flex-shrink: 0; padding: 24px; border-radius: 16px; background: var(--bg); border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 16px">
      <span style="width: 64px; height: 64px; border-radius: 999px; background: var(--accent-subtle); color: var(--accent-text); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800">NL</span>
      <div style="text-align: center">
        <h2 id="pinTitle" style="margin: 0; font-size: 20px; font-weight: 700">Nguyễn Lan</h2>
        <span style="font-size: 14px; color: var(--text-muted)">Nhập mã PIN 6 số</span>
      </div>
      <div aria-label="Đã nhập 4 trên 6 số" style="display: flex; gap: 14px">
        <sc-for list="{{ dots }}" as="d" hint-placeholder-count="6">
          <span style="{{ d.style }}"></span>
        </sc-for>
      </div>
      <span role="alert" style="display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--danger-text)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20M12 8v4M12 16h.01"/></svg>
        PIN chưa đúng · sai 2/5 lần, sai 5 lần sẽ khoá tài khoản
      </span>
      <div style="width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{ keys }}" as="k" hint-placeholder-count="12">
          <button type="button" class="num" aria-label="{{ k.aria }}" style="height: 56px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-subtle); color: var(--text); font-size: 22px; font-weight: 600">{{ k.label }}</button>
        </sc-for>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [['Nguyễn Lan', 'Thu ngân', 'NL'], ['Trần Minh', 'Thu ngân', 'TM'], ['Lê Hà', 'Quản lý', 'LH'], ['Phạm Quân', 'Nhân viên', 'PQ'], ['Võ Ngọc', 'Nhân viên', 'VN'], ['Đỗ Khoa', 'Bếp', 'ĐK']];
    const staff = raw.map(([name, role, initials], i) => ({
      name, role, initials,
      checked: i === 0 ? 'true' : 'false',
      style: 'display: flex; align-items: center; gap: 12px; min-height: 80px; padding: 12px 16px; border-radius: 16px; background: var(--bg); text-align: left; '
        + (i === 0 ? 'border: 2px solid var(--primary); box-shadow: var(--shadow-sm);' : 'border: 2px solid var(--border);'),
      avatar: 'width: 48px; height: 48px; flex-shrink: 0; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; '
        + (i === 0 ? 'background: var(--primary); color: var(--primary-fg);' : 'background: var(--bg-muted); color: var(--text-muted);')
    }));
    const dots = [0, 1, 2, 3, 4, 5].map((i) => ({
      style: 'width: 18px; height: 18px; border-radius: 999px; box-sizing: border-box; ' + (i < 4 ? 'background: var(--text);' : 'border: 2px solid var(--border-strong);')
    }));
    const labels = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'Xoá', '0', '⌫'];
    const keys = labels.map((l) => ({ label: l, aria: l === '⌫' ? 'Xoá một số' : l === 'Xoá' ? 'Xoá hết' : l }));
    return { themeClass: this.props.dark ? 'dark' : '', staff, dots, keys };
  }
}
</script>
</body>
</html>
