<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>POS cầm tay bán hàng</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#CA0404}a:hover{color:#9C0303}
.fnb{--bg:#FFFFFF;--bg-subtle:#F9F6F4;--bg-muted:#F1ECE8;--border:#E4DAD4;--border-strong:#9F8D7F;--text:#282019;--text-muted:#6D5D51;--text-subtle:#7A695C;--primary:#CA0404;--primary-fg:#FFFFFF;--primary-subtle:#FEE7E3;--primary-text:#9C0303;--accent:#ED6F03;--accent-fg:#211510;--success:#2F7D46;--success-subtle:#E0F3E3;--success-text:#17592C;--shadow-sm:0 1px 2px rgba(40,32,25,.08),0 1px 3px rgba(40,32,25,.06);--shadow-md:0 -4px 16px rgba(40,32,25,.14);font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--text);background:var(--bg);line-height:1.45}
.fnb.dark{--bg:#1A1411;--bg-subtle:#282019;--bg-muted:#3E332A;--border:#55473D;--border-strong:#857366;--text:#F9F6F4;--text-muted:#D1C3B9;--text-subtle:#B8A79A;--primary:#F84839;--primary-fg:#1A1411;--primary-subtle:#470000;--primary-text:#FEAEA2;--accent:#FA8840;--accent-fg:#1A1411;--success:#58A46B;--success-subtle:#002A0E;--success-text:#A0D5AB;--shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow-md:0 -4px 16px rgba(0,0,0,.5)}
.fnb button{font-family:inherit;cursor:pointer}
.fnb .num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div class="fnb {{themeClass}}" style="position: relative; width: 400px; height: 860px; overflow: hidden; display: flex; flex-direction: column; background: var(--bg-subtle)">

  <!-- PosShell compact -->
  <header style="height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: var(--bg); border-bottom: 1px solid var(--border)">
    <img src="/_blob/dbbc95b08d47870e1964f1322682c11f" alt="Banhkepchonong" style="width: 32px; height: 32px; object-fit: contain">
    <span style="flex-grow: 1; font-size: 14px; font-weight: 600">Quận 1 · Lan</span>
    <span aria-label="Trực tuyến, đã đồng bộ" role="img" style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border-radius: 999px; background: var(--success-subtle); color: var(--success-text); font-size: 12px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 999px; background: var(--success)"></span>Online</span>
    <button type="button" aria-label="Menu thiết bị" style="width: 44px; height: 44px; border-radius: 10px; border: 0; background: transparent; color: var(--text); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  </header>

  <div style="flex-shrink: 0; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; background: var(--bg)">
    <label style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 10px; color: var(--text-subtle)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" placeholder="Tìm món" style="flex-grow: 1; border: 0; outline: 0; background: transparent; font: inherit; font-size: 16px; color: var(--text)">
    </label>
    <div role="tablist" aria-label="Nhóm món" style="display: flex; gap: 8px; overflow: hidden">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
        <button type="button" role="tab" aria-selected="{{ t.selected }}" style="{{ t.style }}">{{ t.label }}</button>
      </sc-for>
    </div>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 10px 12px 120px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-content: start">
    <sc-for list="{{ products }}" as="p" hint-placeholder-count="6">
      <button type="button" aria-label="{{ p.aria }}" style="{{ p.style }}">
        <div style="position: relative; height: 84px; border-radius: 10px; background: var(--bg-muted); display: flex; align-items: center; justify-content: center; color: var(--text-subtle)">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
          <sc-if value="{{ p.inCart }}" hint-placeholder-val="{{ false }}">
            <span class="num" style="position: absolute; top: 6px; right: 6px; min-width: 24px; height: 24px; border-radius: 999px; background: var(--primary); color: var(--primary-fg); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{ p.qty }}</span>
          </sc-if>
        </div>
        <span style="font-size: 15px; font-weight: 600; text-align: left; color: var(--text)">{{ p.name }}</span>
        <span class="num" style="font-size: 14px; text-align: left; color: var(--text-muted)">{{ p.price }}</span>
      </button>
    </sc-for>
  </div>

  <!-- BottomBar cart -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px; background: var(--bg); border-top: 1px solid var(--border); box-shadow: var(--shadow-md); display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: center"><span style="width: 40px; height: 4px; border-radius: 999px; background: var(--border-strong)"></span></div>
    <a href="pos-handheld-pay.dc.html" style="height: 56px; border-radius: 10px; background: var(--primary); color: var(--primary-fg); display: flex; align-items: center; gap: 12px; padding: 0 16px; text-decoration: none; font-size: 16px; font-weight: 700">
      <span class="num" style="min-width: 28px; height: 28px; border-radius: 999px; background: var(--primary-fg); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 14px">3</span>
      <span style="flex-grow: 1">Giỏ · 3 món</span>
      <span class="num">145.000 ₫</span>
    </a>
    <span style="font-size: 12px; color: var(--text-muted); text-align: center">Vuốt lên để xem giỏ (Drawer) · chạm để thanh toán</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    const tabs = ['Tất cả', 'Hotdog', 'Burger', 'Món thêm', 'Đồ uống'].map((label, i) => ({
      label, selected: i === 1 ? 'true' : 'false',
      style: 'flex-shrink: 0; height: 44px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 600; '
        + (i === 1 ? 'border: 1px solid var(--text); background: var(--text); color: var(--bg);' : 'border: 1px solid var(--border); background: var(--bg); color: var(--text-muted);')
    }));
    const products = [
      ['Hotdog cổ điển', '35.000 ₫', 0], ['Hotdog phô mai', '45.000 ₫', 2], ['Hotdog cay Hàn Quốc', '49.000 ₫', 0],
      ['Hotdog xúc xích Đức', '55.000 ₫', 1], ['Hotdog bò BBQ', '52.000 ₫', 0], ['Hotdog gà giòn', '42.000 ₫', 0]
    ].map(([name, price, qty]) => ({
      name, price, qty, inCart: qty > 0,
      aria: name + ', ' + price,
      style: 'display: flex; flex-direction: column; gap: 4px; padding: 6px 6px 10px; border-radius: 16px; background: var(--bg); box-shadow: var(--shadow-sm); '
        + (qty > 0 ? 'border: 2px solid var(--primary);' : 'border: 2px solid transparent;')
    }));
    return { themeClass: this.props.dark ? 'dark' : '', tabs, products };
  }
}
</script>
</body>
</html>
