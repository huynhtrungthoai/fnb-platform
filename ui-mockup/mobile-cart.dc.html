<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Mobile giỏ hàng</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=Baloo+2:wght@700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#CA0404}a:hover{color:#9C0303}
.fnb{--bg:#FFFFFF;--bg-subtle:#F9F6F4;--bg-muted:#F1ECE8;--border:#E4DAD4;--border-strong:#9F8D7F;--text:#282019;--text-muted:#6D5D51;--text-subtle:#7A695C;--primary:#CA0404;--primary-fg:#FFFFFF;--primary-subtle:#FEE7E3;--primary-text:#9C0303;--accent:#ED6F03;--accent-fg:#211510;--accent-subtle:#FEE8DC;--accent-text:#984502;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--text);background:var(--bg);line-height:1.45}
.fnb.dark{--bg:#1A1411;--bg-subtle:#282019;--bg-muted:#3E332A;--border:#55473D;--border-strong:#857366;--text:#F9F6F4;--text-muted:#D1C3B9;--text-subtle:#B8A79A;--primary:#F84839;--primary-fg:#1A1411;--primary-subtle:#470000;--primary-text:#FEAEA2;--accent:#FA8840;--accent-fg:#1A1411;--accent-subtle:#3A1600;--accent-text:#FEB187}
.fnb button{font-family:inherit;cursor:pointer}
.fnb .num{font-variant-numeric:tabular-nums}
.fnb .display{font-family:'Baloo 2',sans-serif;font-weight:800;line-height:1.15}
</style>
</helmet>
<div class="fnb {{themeClass}}" style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: var(--bg-subtle)">

  <header style="flex-shrink: 0; height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 8px; background: var(--bg); border-bottom: 1px solid var(--border)">
    <a href="mobile-menu.dc.html" aria-label="Quay lại thực đơn" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--text)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
    <h1 class="display" style="margin: 0; font-size: 22px; flex-grow: 1">Giỏ hàng</h1>
    <span class="num" style="font-size: 13px; color: var(--text-muted); padding-right: 12px">3 món</span>
  </header>

  <main style="flex-grow: 1; overflow: hidden; padding: 12px 16px; display: flex; flex-direction: column; gap: 12px">
    <!-- Lines -->
    <section aria-label="Món trong giỏ" style="border-radius: 16px; background: var(--bg); border: 1px solid var(--border); overflow: hidden">
      <sc-for list="{{ lines }}" as="l" hint-placeholder-count="3">
        <div style="display: flex; gap: 10px; padding: 12px; border-bottom: 1px solid var(--border)">
          <span style="width: 56px; height: 42px; flex-shrink: 0; border-radius: 8px; background: var(--bg-muted)"></span>
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
            <div style="display: flex; justify-content: space-between; gap: 8px">
              <div style="display: flex; flex-direction: column">
                <span style="font-size: 15px; font-weight: 700">{{ l.name }}</span>
                <span style="font-size: 12px; color: var(--text-muted)">{{ l.mods }}</span>
              </div>
              <span class="num" style="font-size: 15px; font-weight: 700; white-space: nowrap">{{ l.price }}</span>
            </div>
            <div role="group" aria-label="{{ l.qtyLabel }}" style="display: flex; align-items: center; border: 1px solid var(--border-strong); border-radius: 12px; overflow: hidden; width: fit-content">
              <button type="button" aria-label="Giảm" style="width: 44px; height: 40px; border: 0; background: var(--bg); color: var(--text); font-size: 18px">−</button>
              <span class="num" style="min-width: 24px; text-align: center; font-weight: 700">{{ l.qty }}</span>
              <button type="button" aria-label="Tăng" style="width: 44px; height: 40px; border: 0; background: var(--bg); color: var(--text); font-size: 18px">+</button>
            </div>
          </div>
        </div>
      </sc-for>
      <a href="mobile-menu.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">+ Thêm món khác</a>
    </section>

    <!-- Voucher -->
    <button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 14px; border-radius: 16px; border: 1px dashed var(--accent); background: var(--accent-subtle); color: var(--accent-text); font-size: 14px; font-weight: 600; text-align: left">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2H2v10l9.29 9.29a1 1 0 0 0 1.41 0l8.59-8.59a1 1 0 0 0 0-1.41ZM7 7h.01"/></svg>
      <span style="flex-grow: 1">Bạn có 1 ưu đãi dùng được · Thứ Ba vui vẻ -20%</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </button>

    <!-- Pickup -->
    <section aria-label="Nhận món" style="border-radius: 16px; background: var(--bg); border: 1px solid var(--border); padding: 14px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 10px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--primary)"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        <div style="flex-grow: 1; display: flex; flex-direction: column">
          <span style="font-size: 15px; font-weight: 700">Nhận tại cửa hàng Quận 1</span>
          <span style="font-size: 12px; color: var(--text-muted)">12 Lê Lợi · mở đến 22:00</span>
        </div>
        <button type="button" style="height: 44px; padding: 0 8px; border: 0; background: transparent; color: var(--primary-text); font-size: 14px; font-weight: 700">Đổi</button>
      </div>
      <sc-for list="{{ segs }}" as="s" hint-placeholder-count="2">
        <div role="radiogroup" aria-label="{{ s.label }}" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 4px; gap: 4px; border-radius: 14px; background: var(--bg-muted)">
          <sc-for list="{{ s.opts }}" as="o" hint-placeholder-count="2">
            <button type="button" role="radio" aria-checked="{{ o.checked }}" style="{{ o.style }}">{{ o.label }}</button>
          </sc-for>
        </div>
      </sc-for>
    </section>

    <!-- Totals -->
    <section aria-label="Tổng tiền" style="border-radius: 16px; background: var(--bg); border: 1px solid var(--border); padding: 14px; display: flex; flex-direction: column; gap: 6px; font-size: 14px">
      <div style="display: flex; justify-content: space-between; color: var(--text-muted)"><span>Tạm tính</span><span class="num">119.000 ₫</span></div>
      <div style="display: flex; justify-content: space-between; color: var(--text-muted)"><span>Giảm giá</span><span class="num">0 ₫</span></div>
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding-top: 8px; border-top: 1px dashed var(--border-strong)"><span style="font-weight: 700">Tổng cộng</span><span class="num" style="font-size: 20px; font-weight: 800">119.000 ₫</span></div>
    </section>
  </main>

  <div style="flex-shrink: 0; padding: 12px 16px 28px; background: var(--bg); border-top: 1px solid var(--border)">
    <a href="mobile-checkout-qr.dc.html" class="num" style="height: 52px; border-radius: 16px; background: var(--primary); color: var(--primary-fg); font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Thanh toán · 119.000 ₫</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const lines = [
      { name: 'Hotdog phô mai', mods: 'Sốt cay · Thêm phô mai', price: '55.000 ₫', qty: 1 },
      { name: 'Khoai tây chiên', mods: 'Size L', price: '35.000 ₫', qty: 1 },
      { name: 'Trà đào cam sả', mods: 'Ít đá', price: '29.000 ₫', qty: 1 }
    ].map((l) => ({ ...l, qtyLabel: 'Số lượng ' + l.name }));
    const seg = (on) => 'height: 44px; border: 0; border-radius: 10px; font-size: 14px; '
      + (on ? 'background: var(--bg); color: var(--text); font-weight: 700;' : 'background: transparent; color: var(--text-muted);');
    const segs = [
      { label: 'Thời gian nhận', opts: [{ label: 'Nhận ngay · ~10 phút', on: true }, { label: 'Hẹn giờ' }] },
      { label: 'Hình thức', opts: [{ label: 'Ăn tại quán', on: true }, { label: 'Mang đi' }] }
    ].map((s) => ({ ...s, opts: s.opts.map((o) => ({ label: o.label, checked: o.on ? 'true' : 'false', style: seg(!!o.on) })) }));
    return { themeClass: this.props.dark ? 'dark' : '', lines, segs };
  }
}
</script>
</body>
</html>
