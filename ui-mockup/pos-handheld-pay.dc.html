<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>POS cầm tay thanh toán</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#CA0404}a:hover{color:#9C0303}
.fnb{--bg:#FFFFFF;--bg-subtle:#F9F6F4;--bg-muted:#F1ECE8;--border:#E4DAD4;--border-strong:#9F8D7F;--text:#282019;--text-muted:#6D5D51;--text-subtle:#7A695C;--primary:#CA0404;--primary-fg:#FFFFFF;--primary-subtle:#FEE7E3;--primary-text:#9C0303;--success:#2F7D46;--success-subtle:#E0F3E3;--success-text:#17592C;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--text);background:var(--bg);line-height:1.45}
.fnb.dark{--bg:#1A1411;--bg-subtle:#282019;--bg-muted:#3E332A;--border:#55473D;--border-strong:#857366;--text:#F9F6F4;--text-muted:#D1C3B9;--text-subtle:#B8A79A;--primary:#F84839;--primary-fg:#1A1411;--primary-subtle:#470000;--primary-text:#FEAEA2;--success:#58A46B;--success-subtle:#002A0E;--success-text:#A0D5AB}
.fnb button{font-family:inherit;cursor:pointer}
.fnb .num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div class="fnb {{themeClass}}" style="width: 400px; height: 860px; overflow: hidden; display: flex; flex-direction: column; background: var(--bg-subtle)">

  <header style="height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 8px; background: var(--bg); border-bottom: 1px solid var(--border)">
    <a href="pos-handheld-sale.dc.html" aria-label="Quay lại bán hàng" style="width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--text)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
    <h1 style="margin: 0; flex-grow: 1; font-size: 17px; font-weight: 700">Thanh toán · Ăn tại quán</h1>
    <span style="display: inline-flex; align-items: center; height: 26px; padding: 0 8px; border-radius: 999px; background: var(--success-subtle); color: var(--success-text); font-size: 12px; font-weight: 600">Online</span>
  </header>

  <main style="flex-grow: 1; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 0">
    <button type="button" aria-expanded="false" style="display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); text-align: left">
      <span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 13px; color: var(--text-muted)">4 món · đã trừ giảm giá 10.000 ₫</span><span class="num" style="font-size: 28px; font-weight: 800; line-height: 1.2">198.000 ₫</span></span>
      <span style="font-size: 14px; font-weight: 600; color: var(--text-muted)">Xem món ▾</span>
    </button>

    <div role="radiogroup" aria-label="Phương thức" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button type="button" role="radio" aria-checked="true" style="height: 56px; border-radius: 10px; border: 2px solid var(--primary); background: var(--primary-subtle); color: var(--primary-text); font-size: 15px; font-weight: 700">Tiền mặt</button>
      <button type="button" role="radio" aria-checked="false" style="height: 56px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--bg); color: var(--text); font-size: 15px; font-weight: 600">QR</button>
      <button type="button" role="radio" aria-checked="false" style="height: 56px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--bg); color: var(--text); font-size: 15px; font-weight: 600">Thẻ</button>
    </div>

    <label style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 13px; font-weight: 600">Khách đưa</span>
      <span class="num" style="height: 56px; display: flex; align-items: center; justify-content: flex-end; padding: 0 14px; border: 2px solid var(--primary); border-radius: 10px; font-size: 26px; font-weight: 700">300.000 ₫</span>
    </label>
    <div style="display: flex; gap: 6px">
      <sc-for list="{{ quick }}" as="q" hint-placeholder-count="4">
        <button type="button" class="num" style="{{ q.style }}">{{ q.label }}</button>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 10px 14px; border-radius: 10px; background: var(--success-subtle); color: var(--success-text)">
      <span style="font-size: 15px; font-weight: 600">Tiền thừa</span><span class="num" style="font-size: 24px; font-weight: 800">102.000 ₫</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{ keys }}" as="k" hint-placeholder-count="12">
        <button type="button" class="num" aria-label="{{ k.aria }}" style="height: 50px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 20px; font-weight: 600">{{ k.label }}</button>
      </sc-for>
    </div>
  </main>

  <div style="flex-shrink: 0; padding: 12px; background: var(--bg); border-top: 1px solid var(--border)">
    <a href="pos-paid.dc.html" style="height: 56px; border-radius: 10px; background: var(--primary); color: var(--primary-fg); display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 17px; font-weight: 700">Thu 198.000 ₫</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    const quick = ['Đủ', '200k', '300k', '500k'].map((label, i) => ({
      label,
      style: 'flex: 1 1 0; height: 48px; border-radius: 10px; font-size: 15px; font-weight: 600; '
        + (i === 2 ? 'border: 2px solid var(--text); background: var(--bg-muted); color: var(--text);' : 'border: 1px solid var(--border-strong); background: var(--bg); color: var(--text);')
    }));
    const labels = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '000', '0', '⌫'];
    const keys = labels.map((l) => ({ label: l, aria: l === '⌫' ? 'Xoá một số' : l }));
    return { themeClass: this.props.dark ? 'dark' : '', quick, keys };
  }
}
</script>
</body>
</html>
