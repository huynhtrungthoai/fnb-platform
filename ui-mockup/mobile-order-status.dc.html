<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Mobile theo dõi đơn</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=Baloo+2:wght@700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#CA0404}a:hover{color:#9C0303}
.fnb{--bg:#FFFFFF;--bg-subtle:#F9F6F4;--bg-muted:#F1ECE8;--border:#E4DAD4;--border-strong:#9F8D7F;--text:#282019;--text-muted:#6D5D51;--text-subtle:#7A695C;--primary:#CA0404;--primary-fg:#FFFFFF;--primary-subtle:#FEE7E3;--primary-text:#9C0303;--accent:#ED6F03;--accent-fg:#211510;--accent-subtle:#FEE8DC;--accent-text:#984502;--success:#2F7D46;--success-fg:#FFFFFF;--success-subtle:#E0F3E3;--success-text:#17592C;--brick:#8A2A26;--cream:#F6F1EA;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--text);background:var(--bg);line-height:1.45}
.fnb.dark{--bg:#1A1411;--bg-subtle:#282019;--bg-muted:#3E332A;--border:#55473D;--border-strong:#857366;--text:#F9F6F4;--text-muted:#D1C3B9;--text-subtle:#B8A79A;--primary:#F84839;--primary-fg:#1A1411;--primary-subtle:#470000;--primary-text:#FEAEA2;--accent:#FA8840;--accent-fg:#1A1411;--accent-subtle:#3A1600;--accent-text:#FEB187;--success:#58A46B;--success-fg:#1A1411;--success-subtle:#002A0E;--success-text:#A0D5AB}
.fnb button{font-family:inherit;cursor:pointer}
.fnb .num{font-variant-numeric:tabular-nums}
.fnb .display{font-family:'Baloo 2',sans-serif;font-weight:800;line-height:1.1}
</style>
</helmet>
<div class="fnb {{themeClass}}" style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: var(--bg-subtle)">

  <!-- Top bar -->
  <header style="flex-shrink: 0; height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 8px; background: var(--bg); border-bottom: 1px solid var(--border)">
    <a href="mobile-menu.dc.html" aria-label="Quay lại" style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--text)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <div style="flex-grow: 1; display: flex; flex-direction: column">
      <span style="font-size: 16px; font-weight: 700">Đơn của bạn</span>
      <span style="font-size: 12px; color: var(--text-muted)">Banhkepchonong · Quận 1</span>
    </div>
  </header>

  <main style="flex-grow: 1; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <!-- Number -->
    <section aria-label="Số thứ tự" style="border-radius: 16px; overflow: hidden; background: var(--success-subtle); color: var(--success-text); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 20px 16px">
      <span style="font-size: 13px; font-weight: 700; letter-spacing: .04em">SỐ CỦA BẠN</span>
      <span class="display num" style="font-size: 72px; color: var(--text)">#045</span>
      <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
        Món xong rồi, mời bạn nhận ở quầy
      </span>
      <span style="font-size: 13px; color: var(--text-muted)">Ăn tại quán · thanh toán lúc 19:31</span>
    </section>

    <!-- Tracker -->
    <section style="padding: 16px; border-radius: 16px; background: var(--bg); border: 1px solid var(--border)">
      <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column">
        <sc-for list="{{ steps }}" as="s" hint-placeholder-count="4">
          <li style="display: flex; gap: 12px">
            <div style="display: flex; flex-direction: column; align-items: center">
              <span style="{{ s.dot }}">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ s.icon }}"/></svg>
              </span>
              <span style="{{ s.line }}"></span>
            </div>
            <div style="display: flex; flex-direction: column; padding-bottom: 12px">
              <span style="{{ s.labelStyle }}">{{ s.label }}</span>
              <span class="num" style="font-size: 13px; color: var(--text-muted)">{{ s.time }}</span>
            </div>
          </li>
        </sc-for>
      </ol>
    </section>

    <!-- Items -->
    <section style="padding: 16px; border-radius: 16px; background: var(--bg); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; font-size: 14px">
      <span style="font-size: 15px; font-weight: 700">Món đã gọi</span>
      <sc-for list="{{ items }}" as="i" hint-placeholder-count="3">
        <div style="display: flex; gap: 8px">
          <div style="flex-grow: 1; display: flex; flex-direction: column">
            <span style="font-weight: 600">{{ i.name }}</span>
            <span style="font-size: 13px; color: var(--text-muted)">{{ i.mods }}</span>
          </div>
          <span class="num" style="font-weight: 600">{{ i.price }}</span>
        </div>
      </sc-for>
      <div style="display: flex; justify-content: space-between; padding-top: 10px; border-top: 1px dashed var(--border-strong)">
        <span style="font-weight: 700">Đã thanh toán · QR</span>
        <span class="num" style="font-size: 17px; font-weight: 800">149.000 ₫</span>
      </div>
    </section>
  </main>

  <div style="flex-shrink: 0; padding: 12px 16px 28px; background: var(--bg); border-top: 1px solid var(--border); display: flex; gap: 8px">
    <button type="button" style="height: 52px; padding: 0 16px; border-radius: 16px; border: 1px solid var(--border-strong); background: var(--bg); color: var(--text); font-size: 15px; font-weight: 600">Xem hoá đơn</button>
    <a href="mobile-menu.dc.html" style="flex-grow: 1; height: 52px; border-radius: 16px; background: var(--primary); color: var(--primary-fg); font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Gọi thêm món</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const CHECK = 'M20 6 9 17l-5-5';
    const raw = [
      ['Đã thanh toán', '19:31', 'done'],
      ['Bếp đang làm', '19:32', 'done'],
      ['Món xong · mời nhận', '19:41', 'current'],
      ['Đã nhận món', 'Quầy xác nhận khi giao', 'todo']
    ];
    const steps = raw.map(([label, time, st], i) => ({
      label, time,
      icon: st === 'todo' ? '' : CHECK,
      dot: 'width: 24px; height: 24px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; '
        + (st === 'todo' ? 'border: 2px solid var(--border-strong); box-sizing: border-box; color: transparent;' : 'background: var(--success); color: var(--success-fg);'),
      line: 'width: 2px; flex-grow: 1; min-height: 12px; ' + (i === raw.length - 1 ? 'background: transparent;' : st === 'done' ? 'background: var(--success);' : 'background: var(--border);'),
      labelStyle: 'font-size: 15px; ' + (st === 'current' ? 'font-weight: 800; color: var(--success-text);' : st === 'todo' ? 'font-weight: 500; color: var(--text-muted);' : 'font-weight: 600;')
    }));
    const items = [
      { name: '2× Hotdog phô mai', mods: 'Sốt cay · Thêm phô mai', price: '110.000 ₫' },
      { name: '1× Trà đào cam sả', mods: 'Ít đá', price: '29.000 ₫' },
      { name: '1× Nước suối', mods: '', price: '10.000 ₫' }
    ];
    return { themeClass: this.props.dark ? 'dark' : '', steps, items };
  }
}
</script>
</body>
</html>
