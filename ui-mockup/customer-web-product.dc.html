<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Web khách chi tiết món</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=Baloo+2:wght@700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#CA0404}a:hover{color:#9C0303}
.fnb{--bg:#FFFFFF;--bg-subtle:#F9F6F4;--bg-muted:#F1ECE8;--border:#E4DAD4;--border-strong:#9F8D7F;--text:#282019;--text-muted:#6D5D51;--text-subtle:#7A695C;--primary:#CA0404;--primary-fg:#FFFFFF;--primary-subtle:#FEE7E3;--primary-text:#9C0303;--accent:#ED6F03;--accent-fg:#211510;--accent-subtle:#FEE8DC;--accent-text:#984502;--brick:#8A2A26;--band:#F6F1EA;--scrim:rgba(40,32,25,.55);--shadow-sm:0 1px 2px rgba(40,32,25,.08),0 1px 3px rgba(40,32,25,.06);--shadow-lg:0 16px 48px rgba(40,32,25,.25);font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--text);background:var(--bg);line-height:1.5}
.fnb.dark{--bg:#1A1411;--bg-subtle:#282019;--bg-muted:#3E332A;--border:#55473D;--border-strong:#857366;--text:#F9F6F4;--text-muted:#D1C3B9;--text-subtle:#B8A79A;--primary:#F84839;--primary-fg:#1A1411;--primary-subtle:#470000;--primary-text:#FEAEA2;--accent:#FA8840;--accent-fg:#1A1411;--accent-subtle:#3A1600;--accent-text:#FEB187;--brick:#62211E;--band:#282019;--scrim:rgba(0,0,0,.65);--shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow-lg:0 16px 48px rgba(0,0,0,.6)}
.fnb button{font-family:inherit;cursor:pointer}
.fnb .num{font-variant-numeric:tabular-nums}
.fnb .display{font-family:'Baloo 2',sans-serif;font-weight:800;line-height:1.1}
.fnb .opt{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;border:1px solid var(--border);border-radius:14px;font-size:15px;background:var(--bg)}
</style>
</helmet>
<div class="fnb {{themeClass}}" style="position: relative; width: 100%; min-height: 1000px; overflow: hidden; background: var(--bg)">

  <!-- Background: menu page (dimmed) -->
  <div aria-hidden="true">
    <header style="background: var(--brick); color: #FFFFFF">
      <div style="max-width: 1240px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 12px">
        <img src="/_blob/dbbc95b08d47870e1964f1322682c11f" alt="" style="width: 52px; height: 52px; object-fit: contain">
        <span class="display" style="font-size: 24px">Banhkepchonong</span>
      </div>
      <svg width="100%" height="32" viewBox="0 0 1440 32" preserveAspectRatio="none" style="display: block"><path d="M0 32V12c60 0 60 14 120 14s60-20 120-20 60 20 120 20 60-20 120-20 60 20 120 20 60-20 120-20 60 20 120 20 60-20 120-20 60 20 120 20 60-20 120-20 60 20 120 20 60-14 120-14v20Z" fill="var(--bg)"/></svg>
    </header>
    <div style="max-width: 1240px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px">
      <sc-for list="{{ bgCards }}" as="c" hint-placeholder-count="8">
        <div style="border-radius: 20px; overflow: hidden; border: 1px solid var(--border); background: var(--bg)">
          <div style="aspect-ratio: 4 / 3; background: var(--bg-muted)"></div>
          <div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-weight: 700">{{ c.name }}</span><span class="num" style="color: var(--text-muted)">{{ c.price }}</span></div>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- Scrim + Dialog -->
  <div style="position: absolute; inset: 0; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 32px; box-sizing: border-box">
    <section role="dialog" aria-modal="true" aria-labelledby="pTitle" style="width: 100%; max-width: 960px; max-height: 100%; border-radius: 28px; background: var(--bg); box-shadow: var(--shadow-lg); display: flex; overflow: hidden; flex-wrap: wrap">
      <!-- Image -->
      <div style="flex: 1 1 380px; position: relative; background: var(--band); display: flex; flex-direction: column">
        <div style="aspect-ratio: 4 / 3; background: var(--bg-muted); display: flex; align-items: center; justify-content: center; color: var(--text-subtle); position: relative">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
          <span style="position: absolute; top: 16px; left: 16px; height: 30px; padding: 0 14px; border-radius: 999px; background: var(--accent); color: var(--accent-fg); font-size: 14px; font-weight: 800; display: flex; align-items: center">Bán chạy</span>
        </div>
        <div style="padding: 24px; display: flex; flex-direction: column; gap: 8px">
          <h2 id="pTitle" class="display" style="margin: 0; font-size: 36px">Hotdog phô mai</h2>
          <span class="num" style="font-size: 20px; font-weight: 800">Từ 45.000 ₫</span>
          <p style="margin: 0; font-size: 15px; color: var(--text-muted)">Xúc xích nướng than, phô mai cheddar tan chảy, hành phi giòn trong ổ bánh mì mềm nướng bơ.</p>
        </div>
      </div>

      <!-- Options -->
      <div style="flex: 1 1 420px; display: flex; flex-direction: column; min-width: 0">
        <div style="display: flex; justify-content: flex-end; padding: 12px 12px 0">
          <a href="customer-web-home.dc.html" aria-label="Đóng" style="width: 44px; height: 44px; border-radius: 999px; background: var(--bg-muted); color: var(--text); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></a>
        </div>
        <div style="padding: 0 28px 20px; display: flex; flex-direction: column; gap: 20px; overflow: auto">
          <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
            <legend style="display: flex; width: 100%; justify-content: space-between; align-items: baseline; padding: 0 0 8px; font-size: 17px; font-weight: 800">Chọn size</legend>
            <sc-for list="{{ sizes }}" as="o" hint-placeholder-count="2">
              <label class="opt" style="{{ o.style }}"><input type="radio" name="size" checked="{{ o.on }}" style="width: 20px; height: 20px; accent-color: var(--primary)"><span style="flex-grow: 1">{{ o.label }}</span><span class="num" style="color: var(--text-muted)">{{ o.price }}</span></label>
            </sc-for>
          </fieldset>
          <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
            <legend style="padding: 0 0 8px; font-size: 17px; font-weight: 800">Chọn sốt <span style="font-size: 13px; font-weight: 700; color: var(--primary-text)">· Bắt buộc, chọn 1</span></legend>
            <sc-for list="{{ sauces }}" as="o" hint-placeholder-count="3">
              <label class="opt" style="{{ o.style }}"><input type="radio" name="sauce" checked="{{ o.on }}" style="width: 20px; height: 20px; accent-color: var(--primary)"><span style="flex-grow: 1">{{ o.label }}</span><span class="num" style="color: var(--text-muted)">{{ o.price }}</span></label>
            </sc-for>
          </fieldset>
          <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
            <legend style="padding: 0 0 8px; font-size: 17px; font-weight: 800">Thêm topping <span style="font-size: 13px; font-weight: 500; color: var(--text-muted)">· Tuỳ chọn, tối đa 3</span></legend>
            <sc-for list="{{ toppings }}" as="o" hint-placeholder-count="3">
              <label class="opt" style="{{ o.style }}"><input type="checkbox" checked="{{ o.on }}" disabled="{{ o.off }}" style="width: 20px; height: 20px; accent-color: var(--primary)"><span style="flex-grow: 1">{{ o.label }}</span><span class="num" style="color: var(--text-muted)">{{ o.price }}</span></label>
            </sc-for>
          </fieldset>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px">
            <span style="font-weight: 800">Ghi chú cho quán</span>
            <textarea rows="2" placeholder="Ví dụ: ít cay, không hành" style="padding: 12px 16px; border: 1px solid var(--border-strong); border-radius: 16px; background: var(--bg); color: var(--text); font: inherit; font-size: 15px; resize: none"></textarea>
          </label>
        </div>
        <div style="margin-top: auto; display: flex; gap: 12px; padding: 16px 28px 24px; border-top: 1px solid var(--border)">
          <div style="display: flex; align-items: center; border: 1px solid var(--border-strong); border-radius: 16px; overflow: hidden">
            <button type="button" aria-label="Giảm số lượng" style="width: 48px; height: 52px; border: 0; background: var(--bg); color: var(--text); font-size: 22px">−</button>
            <span class="num" style="min-width: 32px; text-align: center; font-size: 17px; font-weight: 800">1</span>
            <button type="button" aria-label="Tăng số lượng" style="width: 48px; height: 52px; border: 0; background: var(--bg); color: var(--text); font-size: 22px">+</button>
          </div>
          <a href="customer-web-checkout.dc.html" class="num" style="flex-grow: 1; height: 52px; border-radius: 16px; background: var(--primary); color: var(--primary-fg); font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-decoration: none">Thêm vào giỏ · 55.000 ₫</a>
        </div>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const pick = (on) => (on ? 'border: 2px solid var(--primary); background: var(--primary-subtle);' : '');
    const sizes = [['Size M', '45.000 ₫', true], ['Size L', '+10.000 ₫', false]].map(([label, price, on]) => ({ label, price, on, style: pick(on) }));
    const sauces = [['Sốt cay', '+0 ₫', true], ['Mù tạt mật ong', '+0 ₫', false], ['Sốt cà chua', '+0 ₫', false]].map(([label, price, on]) => ({ label, price, on, style: pick(on) }));
    const toppings = [['Thêm phô mai', '+10.000 ₫', true, false], ['Thêm xúc xích', '+15.000 ₫', false, false], ['Hành phi · tạm hết', '', false, true]]
      .map(([label, price, on, off]) => ({ label, price, on, off, style: pick(on) + (off ? ' opacity: .55;' : '') }));
    const bgCards = ['Hotdog cay Hàn Quốc', 'Hotdog phô mai', 'Hotdog cổ điển', 'Hotdog xúc xích Đức', 'Burger bò', 'Burger gà giòn', 'Khoai tây chiên', 'Trà đào cam sả']
      .map((name, i) => ({ name, price: ['49.000 ₫', '45.000 ₫', '35.000 ₫', '55.000 ₫', '59.000 ₫', '52.000 ₫', '25.000 ₫', '29.000 ₫'][i] }));
    return { themeClass: this.props.dark ? 'dark' : '', sizes, sauces, toppings, bgCards };
  }
}
</script>
</body>
</html>
