# Runs the same check as the local `pnpm verify`: typecheck, lint, format check, tests, build.
# A red run blocks the merge (plans/02-repo-setup.md section 3.1).
name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: pnpm verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # API integration tests run against a real Postgres and Redis (M1-05). Ports and credentials
    # match .env.example, which the API falls back to when no .env file exists. The tests create
    # and drop their own database (`fnb_test`) and use Redis database 15.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fnb
          POSTGRES_PASSWORD: fnb_local_dev
          POSTGRES_DB: fnb
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U fnb -d fnb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # The pnpm version comes from `packageManager` in package.json (D-12).
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Storage and every external service are faked in tests; only Postgres and Redis are real.
      - name: Verify
        run: pnpm verify
