# Runs the same check as the local `pnpm verify`: typecheck, lint, format check, tests, build.
# A red run blocks the merge (plans/02-repo-setup.md section 3.1).
name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: pnpm verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # The pnpm version comes from `packageManager` in package.json (D-12).
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Tests use fakes only: no database, Redis, storage or external service is needed.
      - name: Verify
        run: pnpm verify
