packages:
  - 'apps/*'
  - 'packages/*'

# Shared versions. Checked against the registry on 2026-11-26 (plans/02-repo-setup.md section 3).
# pnpm only installs versions published more than 24 hours ago (minimumReleaseAge); do not add
# minimumReleaseAgeExclude entries to get a newer one, lower the range instead.
catalog:
  '@aws-sdk/client-s3': ^3.1177.0
  '@eslint/js': ^10.0.1
  '@fontsource/be-vietnam-pro': ^5.3.0
  '@nestjs/cli': ^12.0.15
  '@nestjs/common': ^12.6.2
  '@nestjs/core': ^12.6.2
  '@nestjs/platform-express': ^12.6.2
  '@nestjs/testing': ^12.6.2
  '@node-rs/argon2': ^2.2.2
  '@swc/core': ^1.16.22
  '@tailwindcss/vite': ^4.3.5
  '@tanstack/react-router': ^1.170.46
  '@tanstack/router-plugin': ^1.169.0
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.13
  '@types/express': ^5.0.6
  '@types/node': ^24.19.4
  '@types/pg': ^8.23.1
  '@types/react': ^19.3.3
  '@types/react-dom': ^19.3.0
  '@types/supertest': ^7.2.1
  '@vitejs/plugin-react': ^6.3.0
  bullmq: ^6.7.10
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-kit: ^0.31.11
  drizzle-orm: ^0.45.4
  eslint: ^10.15.0
  eslint-config-prettier: ^10.1.8
  eslint-import-resolver-typescript: ^4.4.5
  eslint-plugin-i18next: ^6.1.5
  eslint-plugin-import-x: ^4.18.1
  eslint-plugin-react-hooks: ^7.1.1
  express: ^5.3.0
  globals: ^17.14.0
  i18next: ^27.2.9
  ioredis: ^6.1.0
  jose: ^6.2.18
  jsdom: ^31.0.1
  lucide-react: ^1.80.0
  pg: ^8.23.1
  prettier: ^3.10.1
  prettier-plugin-tailwindcss: ^0.8.1
  radix-ui: ^1.8.1
  react: ^19.3.1
  react-dom: ^19.3.1
  react-i18next: ^18.0.3
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  sharp: ^0.35.5
  supertest: ^7.3.2
  tailwindcss: ^4.3.5
  turbo: ^2.11.13
  # TypeScript stays on 6.0.x until the NestJS and typescript-eslint toolchain supports 7 (D-11).
  typescript: ~6.0.3
  typescript-eslint: ^8.74.0
  unplugin-swc: ^2.0.0
  vite: ^8.3.8
  vitest: ^5.1.2
  zod: ^4.6.7

# Dependency build scripts are blocked unless listed here (pnpm 11).
# @swc/core: its postinstall only re-checks the native binary, which arrives as an optional dependency.
allowBuilds:
  '@swc/core': false
  # esbuild (pulled in by drizzle-kit): same case, the platform binary is an optional dependency.
  esbuild: false
  # msgpackr-extract (pulled in by bullmq): optional native speed-up; msgpackr falls back to plain JS.
  msgpackr-extract: false
